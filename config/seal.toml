# Seal protocol configuration (invariant 1). Paths are relative to the repo root;
# "${upstream}" expands to upstream_path.
predictions_dir = "ledger/predictions"
upstream_path = "../kv-transfer-replication"

# Every root below MUST exist when a prediction is written (the writer fails closed on a
# missing root: a fitted mapper could be hiding behind an unmounted tree). The CI verifier
# checks hashes and immutability only and does not consult roots.
# Layout provenance: kv-transfer-replication@f3594458f73d70a15f195c863d52ea6592f61578,
# kvt/mapper.py::Mapper.save and scripts/fit_mapper.py::resolve_out_dirs.
[[artifact_roots]]
path = "mappers"
pattern = "{pair}/**/k*.safetensors"

[[artifact_roots]]
path = "results/mapper"
pattern = "{pair}/**/r2.json"

[[artifact_roots]]
path = "${upstream}/mappers"
pattern = "{pair}/**/k*.safetensors"

[[artifact_roots]]
path = "${upstream}/results/mapper"
pattern = "{pair}/**/r2.json"

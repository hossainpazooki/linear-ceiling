# The cache reading of the Finance Agent run's paired helper sub-calls (ledger entry 0076, a registration).
# Inputs: `tools/cache_behavior/run.py --prepare --config config/cache-behavior-fab.toml` (tools/cache_behavior/fab_pairs.py)
# builds token-id pairs from the run's ended questions, by entry 0075's sub-calls and document tokens; it refuses
# before the window ends and until the committed ledger holds 0075. The driver refuses until it holds 0076.
# The reader, cap, chunking, continuation, controls and tau_K are config/cache-behavior.toml's (entry 0047).
cell = "fab-pairs"
model = "Qwen/Qwen3-1.7B"
revision = "70d244cc86ccca08cf5af4e1e306ecf908b1ad5e"
transformers = "5.17.0"
torch = "2.14.0"
seed = 20261001
window_end = "2026-11-20T12:00:00Z"   # a question is read only if every launch record's `end` is at or before it
min_matched_tokens = 64               # |M| below this: excluded and counted
max_pairs = 60                        # the ceiling, taken in the registered order
context_cap = 81920                   # exclude, never truncate: A's prefill and B plus its continuation
host_memory_limit_GiB = 88            # the stated host-memory requirement: a pair predicted above it is excluded
host_fixed_GiB = 12                   # the prediction's fixed part: the runtime, the logits and per-layer work
host_bytes_per_matched_token = 917504 # four float32 copies of M's K and V on the host: 4 x 28 x 8 x 128 x 2 x 4 B
chunk_tokens = 256
continuation_tokens = 256             # the serving model's logged response to B, C[0] unscored
continuation_chunk = 16
prefix_control_tokens = 128
control_max_logit_error = 0.0005
bridge_absolute_tolerance = 0.001     # used per token by the cross-instrument control
bridge_relative_tolerance = 0.01
tau_K = 0.3186442653116294
attention_queries = 0                 # no attention slice: it needs the deviation before the fresh pass
attention_query_chunk = 16
oracle_fractions = []

[gate]
prepare_entries = ["0075", "0076"]
run_entries = ["0075", "0076"]

[cross_check]                         # entry 0049's probe handoff and its prepared inputs (E9-long's delta_K)
handoff = "20241016_composio_swekit/django__django-11087_traj#152"
manifest_sha256 = "2aeee5769c0a3b557e1fecd43c2a745abe9f29c37af66b0eabb54358b4c35b22"
file_sha256 = "3f79826e8a0168d79d8e37072472e3d8022d4dc0b9db010c1511b5ff3fbab6bd"

[rope]
rope_type = "yarn"
factor = 2.5
original_max_position_embeddings = 32768

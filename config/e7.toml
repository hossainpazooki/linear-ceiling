# E7 measurement program -- parameters registered in ledger entries 0006 + 0007.
# assert_ready refuses replay until this file and ledger/ledger.md are committed unmodified.

[e7]
traces_dir = "traces"          # gitignored; real trajectories live here, never in history
results_dir = "results/e7"

[e7.pricing]                    # pins retrieved 2026-09-01 (entry 0006; provenance in docs/2026-09-01-measurement-lane-evidence.md)
provider = "anthropic"
read_mult = 0.1                 # cache read, x base input price
write_mult = 1.25               # 5-minute ephemeral cache write -- the base case (entry 0007)
write_mult_1h = 2.0             # 1-hour tier: sensitivity only, verdict-bearing for nothing
ttl_seconds = 300

[e7.thresholds]                 # entry 0006, amended by 0007
materiality_fraction = 0.10     # H-E7a: recoverable prefill spend / total input spend, Lane A ALONE
negative_mass_fraction = 0.25   # H-E7b: fraction of compaction events net-negative, must hold under BOTH bounds
min_trajectories_per_suite = 50
min_agents_per_suite = 3        # distinct agents/scaffolds, not runs (entry 0007)
min_suites = 2

[e7.tokenizer]                  # registered in ledger entry 0009; divisors MEASURED, not guessed
encoding = "o200k_base"         # pinned by name; gpt-4o's public encoder (tiktoken)
default_strategy = "calibrated"

[e7.tokenizer.agent_strategy]
"gpt-4o" = "exact"              # public encoder exists -> no estimate at all
"sonnet-35-new" = "calibrated"  # Anthropic publishes no tokenizer -> per-type divisors

[e7.tokenizer.divisors]         # chars per token, measured on the exact half of this suite
system = 4.817                  # (2026-09-01, 34.4M chars / 9.25M tokens over all 4 files)
user = 4.322
assistant = 4.005
tool_output = 2.890
tool_args = 3.467

[e7.lane_b]
policy = "two-tier-cascade"     # planning turns large tier, tool-execution turns small tier;
                                # every tier boundary is a switch point (entry 0006, frozen)

[e7.overlap_null]               # entry 0024: null controls for the entry-0010 overlap (summarize_e7 --overlap-null)
seed = 24                       # derangement over composio trajectory ids, then cross-family partner draws

# E9-long -- H-E9's registered instrument on the LONG half of the observed handoffs (registration entry 0035;
# seed docs/2026-09-08-seed-e9-long-half.md). The receiver reaches 35K-80K positions by static YaRN scaling
# (D1(a)), which is an upstream code change (kvt/rope.py RopeSpec, kvt/models.py scaled_config, dump_kv
# --rope-scaling) and a new pin. The rule, tau, band, ladder, controls and seam bins are copied BYTE-FOR-BYTE
# from config/e9.toml (entries 0023, 0025); nothing here re-decides H-E9. The verdict set is the NEWLY
# included handoffs only: |S| or |R| above the prior cap 32,768 (excluded by 0029) and both within 81,920.
# e9.assert_ready refuses until this file and ledger/ledger.md (with the entries in [e9.gate]) are committed
# unmodified AND the upstream checkout is at `upstream_sha`, clean for every invoked path.

[e9]
pair = "qwen3-0.6b-to-1.7b"          # receiver = target (1.7B), source = 0.6B; mapper k from [e9.mapper]
results_dir = "results/e9l"
scratch_dir = "results/e9l/scratch"  # per-handoff dumps, deleted after scoring unless kept
upstream_path = "../kv-transfer-replication"
upstream_sha = "063f4023fdde67dedbee01a92518ce7f83f6cf5d"   # entry 0035: the RoPE-spec commit (successor of 4633718)

[e9.gate]                            # entries the committed ledger must carry (the driver's REQUIRED_ENTRIES per config)
required_entries = ["0019", "0023", "0025", "0027", "0035"]

[e9.handoffs]
suite = "swe-bench"
agent = "composio_swekit"            # the only family with observed Lane A switches (entries 0010/0015)
context_cap = 81920                  # 32,768 x 2.5: the knee of the cap ladder (+35 of the 39 excluded for length)
context_floor = 32768                # a handoff with |S| AND |R| within the floor was decided under 0029's cap and is EXCLUDED here, counted

[e9.rope]                            # D1(a): static YaRN on BOTH models, HF form; applied to every dump of this run
rope_type = "yarn"
factor = 2.5
original_max_position_embeddings = 32768

[e9.order]                           # registered run order and stopping rule (unattended overnight sitting)
by = "n_sender_asc"                  # shortest sender first; ties by handoff id (none among the 35)
allow_partial = true                 # `e9 --close-partial` may close an unfinished run: the scored set must be a PREFIX of the
                                     # registered order; the verdict entry names the unscored by id; coverage travels with the number

[e9.bridge]                          # control 4 (seed section 5): the scaled receiver vs the native one, same tokens, same box
handoffs = [                         # the three SHORTEST of 0029's kept subset (cheapest; native dumps also at home under results/e9/scratch)
  "20241025_composio_swekit/django__django-10999_traj#64",
  "20241025_composio_swekit/django__django-11066_traj#36",
  "20241016_composio_swekit/astropy__astropy-14182_traj#68",
]
reading_max_fstar = 0.15             # if the median native-vs-scaled f*(tau_K) exceeds this, H-E9L is read as a claim about the SCALED receiver only

[e9.profiles]                        # control 5 (seed section 5): descriptive length profiles, bins fixed before data
s_len_edges = [32768, 50000, 65000]  # |S| bins: (32768, 49999] / [50000, 64999] / [65000, 81920]
s_pos_edges = [0, 32768, 49152, 65536]   # matched-token position in S: 0-32767 / 32768-49151 / 49152-65535 / 65536-81920

[e9.alignment]
method = "difflib.SequenceMatcher(autojunk=False).get_matching_blocks over token ids"

[e9.mapper]
k = 1                                # the only non-collapsed held-out mapper (entry 0016); the n = 50 mapper 0029 used (D4: n = 420 at home via e9_rescore)
space = "content"

[e9.keep]                            # handoffs whose full dumps are retained for CPU recomputation
seed = 9
n = 3                                # D3: a fresh draw of 3 from the sorted newly-included ids (not nested with 0025's draw of 8)

[e9.rule]                            # entry 0023 (supersedes 0019's band clause): median over included
                                     # handoffs of f*(tau_K) on the K read-out, centered per-head delta
statistic = "median f*(tau_K) over included handoffs, E9-same, K"
holds_max = 0.15                     # anchored to CacheBlend's 10-15% recompute of high-deviation tokens
degrades_min = 0.50                  # the operator's stated judgment (0023), not a citation
# tau per read-out = 1 - the archived k=1 held-out R^2 (per-head A5, head- and layer-averaged), written
# by `summarize_e9 --calibrate-tau` into results/e9/calibration/tau.json and copied here; the
# summarizer recomputes both and refuses on disagreement. V's tau serves only the alongside f*.
tau_K = 0.3186442653116294
tau_V = 0.4867056499055992
# entry 0025, descriptive: f*(tau) is ALSO reported at each tau below, K and V, every arm, per handoff and
# median, so a HOLDS says how far inside the registered tolerance identity sits. The cells and the band
# are computed at tau_K above only; nothing on this ladder is verdict-bearing. Fixed before any prefill.
tau_ladder = [0.10, 0.03]
# entry 0025, alongside (review finding 2): tau_K above anchors to the k=1 mapper's held-out R^2 on GENERIC
# text (0016 arm (a)); entry 0020 arm (b) measured the same mapper on AGENT text at K R^2 = 0.5629, so on the
# distribution E9 actually reads, "no more than the mapper itself" is 1 - 0.5629. f* is reported at this tau
# too, every arm; it is verdict-bearing for nothing. Recomputed by summarize_e9 from results/e8/report.json
# (arm (b), k = 1) and refused on disagreement, like tau_K.
tau_agent_K = 0.4371020133925453
# entry 0025 (review finding 5): f*(tau_K) is ALSO reported over tokens whose matched block is at least this
# long (blocks re-derived from the pairs), beside the block-length distribution; descriptive.
min_block_len = 4

[e9.controls]                        # registered, decide nothing (0023)
null_seed = 23                       # delta_null: seeded derangement of sender positions on the first handoff
seam_bins = [0, 1, 2, 4, 8, 16]      # b(t) bins 0 / 1 / 2-3 / 4-7 / 8-15 / 16+, fixed before data
# entry 0025 (review finding 3): the 0023 identity control scores a dump against itself and cannot fail on
# the box. Prefix invariance can: the receiver prefills S followed by R's first token, and rows 0..|S|-1
# must equal the S dump up to kernel arithmetic (causal attention). HALTS if the max centered per-token
# deviation (token mean, K or V) exceeds this -- three orders below tau_K, well above float32 noise.
prefix_invariance_max_delta = 1e-4
# entry 0025 (review finding 6): seeded percentile bootstrap of the median f*(tau_K) over included handoffs,
# reported beside the point median the rule reads; lower/upper at 2.5 / 97.5 with e7_stats.quantile.
bootstrap_seed = 25
bootstrap_reps = 2000
